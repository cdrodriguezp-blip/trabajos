<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconstruir árbol binario · Taller de PHP</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecera">
            <a class="volver" href="../index.html">Menú</a>
            <h1><span class="glifo">Λ</span>Reconstruir árbol binario</h1>
        </header>

        <div class="panel">
            <form class="tarjeta">
                <input type="hidden" name="punto" value="6">
                <p class="ayuda">Completa al menos dos recorridos, con los nodos separados por comas.</p>
                <div class="campo">
                    <label for="preorden">Preorden</label>
                    <input type="text" id="preorden" name="preorden" placeholder="A, B, D, E, C" autofocus>
                </div>
                <div class="campo">
                    <label for="inorden">Inorden</label>
                    <input type="text" id="inorden" name="inorden" placeholder="D, B, E, A, C">
                </div>
                <div class="campo">
                    <label for="postorden">Postorden</label>
                    <input type="text" id="postorden" name="postorden" placeholder="D, E, B, C, A">
                </div>
                <button type="submit" class="boton">Construir árbol</button>
            </form>

            <section class="tarjeta resultado" aria-live="polite">
                <p class="vacio">Completa al menos dos recorridos y pulsa «Construir árbol».</p>
            </section>
        </div>
    </main>

    <script src="../app.js"></script>
</body>
</html>
