<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con historial · Taller de PHP</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecera">
            <a class="volver" href="../index.html">Menú</a>
            <h1><span class="glifo">÷%</span>Calculadora con historial</h1>
        </header>

        <div class="panel">
            <div>
                <form class="tarjeta">
                    <input type="hidden" name="punto" value="7">
                    <div class="campo">
                        <label for="num1">Número 1</label>
                        <input type="number" id="num1" name="num1" step="any" required autofocus>
                    </div>
                    <div class="campo">
                        <label for="num2">Número 2</label>
                        <input type="number" id="num2" name="num2" step="any" required>
                    </div>
                    <div class="campo">
                        <label for="operacion">Operación</label>
                        <select id="operacion" name="operacion">
                            <option value="suma">Suma (+)</option>
                            <option value="resta">Resta (−)</option>
                            <option value="multiplicacion">Multiplicación (×)</option>
                            <option value="division">División (÷)</option>
                            <option value="porcentaje">Porcentaje (%)</option>
                        </select>
                    </div>
                    <button type="submit" class="boton">Calcular</button>
                </form>

                <section class="tarjeta historial">
                    <h2>Historial</h2>
                    <ul id="historial"></ul>
                    <button type="button" class="boton suave" id="borrar-historial">Borrar historial</button>
                </section>
            </div>

            <section class="tarjeta resultado" aria-live="polite">
                <p class="vacio">Escribe dos números, elige una operación y pulsa «Calcular».</p>
            </section>
        </div>
    </main>

    <script src="../app.js"></script>
</body>
</html>
